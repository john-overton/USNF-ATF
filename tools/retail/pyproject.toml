[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retail"
version = "0.1.0"
description = "Phase 0 retail-format toolkit for Jane's USNF'97 / ATF Gold media (EALIB, ESA, PKWare DCL)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
retail = "retail.__main__:main"

[tool.setuptools.packages.find]
include = ["retail*"]
